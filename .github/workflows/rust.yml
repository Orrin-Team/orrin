name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build deps for shaderc-sys. With no system libshaderc_shared present,
      # shaderc-sys builds a *static* libshaderc from source, so the
      # vulkano-shaders proc-macro is self-contained — nothing for rustc to
      # dynamically resolve when it loads the macro (the E0463 we were hitting).
      #
      # libudev is gilrs's Linux backend: it enumerates gamepads through
      # /dev/input, so the input crate does not link without the headers.
      - name: Install shaderc and gamepad build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 build-essential git \
            pkg-config libudev-dev

      # Nightly, to match rust-toolchain.toml. The file alone would be enough —
      # cargo honours it and fetches the channel itself — but then this step
      # would install a stable that nothing ever runs, so the two are kept in
      # step instead.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # Scripting is a default feature, so the workspace build compiles
      # orrin-script and hosts CoreCLR. The Rust half needs only the nethost
      # binary, which netcorehost fetches from NuGet on its own — the SDK here
      # is for the managed half: the bindings, the demo game, and the math
      # tests below. Keep the version in step with the TargetFramework in
      # scripting/Orrin/Orrin.csproj and the `net10_0` feature in
      # crates/orrin-script/Cargo.toml; all three have to agree.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Bump this suffix to drop any poisoned proc-macro artifact cached by
          # an earlier failing run.
          prefix-key: "v2-rust"

      # Neither of these ran here before, which is how `cargo clippy` came to be
      # failing on three FFI lints without CI ever saying so. `-D warnings` is
      # what keeps that from happening again — with the cost, on a floating
      # nightly, that a lint added upstream turns the build red on a day nobody
      # changed anything. Relax to a bare `cargo clippy` if that trade stops
      # being worth it.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      # Prebuilt binary, so this costs a download rather than a compile.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # nextest runs each test in its own process and schedules them across the
      # runner's cores: 4.7s -> 1.1s on this suite locally. Retries are
      # deliberately not enabled — a test that only passes on the second
      # attempt is a bug worth failing over, not noise worth hiding.
      - name: Test
        run: cargo nextest run --workspace

      # nextest does not run doctests, so they keep their own step. Dropping
      # this would silently stop compiling the one in `World::spawn_entity`.
      - name: Doctests
        run: cargo test --workspace --doc

      # The other build shape. Scripting is on by default because a
      # second-class build is one nobody compiles until it has already rotted —
      # and the same is true in reverse, so the no-.NET build is compiled here
      # rather than trusted. It is a `check` and not a `build` on purpose: what
      # can break is the `#[cfg(feature = "scripting")]` seams, and those fail
      # to typecheck long before anything reaches the linker.
      - name: Check the build without scripting
        run: cargo check -p orrin-core --no-default-features --all-targets --verbose

      # The managed half, which no Rust target reaches. The bindings assembly
      # is the engine's own and boots CoreCLR; DemoGame is a game assembly like
      # any project's, and building it here is what keeps the one loading path
      # honest.
      - name: Build the C# assemblies
        run: |
          dotnet build scripting/Orrin
          dotnet build scripting/DemoGame

      # Math conventions are a public, breaking-to-change API (right-handed,
      # -Z forward, degrees, YXZ euler, Hamilton products) and System.Numerics
      # is the oracle they are checked against. It also asserts the layout of
      # the blittable structs the ABI is frozen on — `sizeof(Transform) == 40` —
      # which is the half of the Rust/C# lock-step that no Rust test can see.
      - name: C# math and ABI layout tests
        run: dotnet run --project scripting/Orrin.MathTests

      # Architecture §6: "editor cold start stays under a few seconds, guarded
      # by a CI benchmark, because startup time decays one dependency at a
      # time." The gate itself already ran above as part of the workspace tests
      # — this repeats it only to put the measured number in the log, so the
      # trend is visible per commit instead of only when the cap is finally
      # breached. It reuses the test artifacts just built, so it costs seconds.
      #
      # It measures the CPU half of startup (registration, resources, meshes,
      # textures, scene graph) through a headless backend. Device creation is
      # absent because the runner has no GPU; see crates/core/tests/cold_start.rs
      # for why that is the right line to draw.
      - name: Cold start benchmark
        run: cargo test -p orrin-core --test cold_start -- --nocapture

  # The engine was developed on macOS and Linux, and the first Windows run found
  # bugs neither could: `Path::is_absolute` needs a drive *and* a root there, and
  # Git for Windows checks golden files out as CRLF. Only the steps whose result
  # can differ by platform run here; fmt, the no-scripting check and the C# half
  # are the same answer on every OS and stay in the job above.
  windows:
    runs-on: windows-latest
    # The image ships CMake 4, which refuses `cmake_minimum_required` below 3.5,
    # and the shaderc sources vendored in shaderc-sys 0.8 still declare older.
    # Read by every CMake the build scripts start, nested projects included.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # No .NET SDK: netcorehost fetches nethost itself, and the script
      # lifecycle test skips without a built `Orrin` assembly, as it does above.

      # With no Vulkan SDK on the runner, shaderc-sys builds libshaderc from
      # source, and on MSVC it refuses to without Ninja. CMake, Python and the
      # MSVC toolchain are on the image already; the `cmake` crate supplies the
      # compiler environment itself, so no developer prompt is needed.
      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust"

      # `cfg(windows)` code is only linted where it compiles.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace

      - name: Doctests
        run: cargo test --workspace --doc

      # Release is what ships, and thin LTO with one codegen unit is a different
      # link from the dev one — the MSVC CRT mix from nethost surfaces here as
      # LNK4098. This is a second full compile, and the slowest step in the job.
      - name: Release build
        run: cargo build --workspace --release

[package]
name = "orrin-core"
version.workspace = true
edition.workspace = true

[dependencies]
orrin-project.workspace =  true
orrin-script = { workspace = true, optional = true }
orrin-build = { workspace = true, optional = true }
orrin-ecs.workspace = true
# `egui` turns on the registry's inspector vtable entry. No new dependency:
# egui is already below.
orrin-registry = { workspace = true, features = ["egui"] }
vulkano.workspace = true
winit.workspace = true
glam.workspace = true
gltf.workspace = true
image.workspace = true
egui.workspace = true
egui-winit.workspace = true
rfd.workspace = true
pollster.workspace = true
# SVG image loader for the editor's logo. egui renders no SVG itself.
egui_extras = { version = "0.31", features = ["svg"] }
serde.workspace = true
# User themes are hand-authored TOML; editor preferences are machine-written RON
# (a dock layout is a tree of enums, which TOML cannot express).
toml.workspace = true
ron = "0.10"
sysinfo = "0.33"
# Filesystem watching: rebuild-on-save, and reimport-on-save for assets, which
# every build shape has — architecture §6 asks that asset edits never need a
# restart, with or without .NET.
notify = "8"
# The asset cache's content hash. xxh3 only: one crate, no dependencies of its
# own, and no build script. Not a cryptographic hash, which is right for a cache
# no one else writes into — see `asset_db::cache` for when that changes.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Raw VK_EXT_memory_budget query for VRAM usage; pinned to vulkano 0.35's ash.
ash = "0.38"
# GPU blocks are `#[repr(C)]` plain data; `Pod` is how one becomes bytes for an
# upload without naming a graphics API. Already in the tree through glam.
bytemuck = { version = "1", features = ["derive"] }
# The engine-owned synchronisation vocabulary in `gfx::graph`. Already in the
# tree through vulkano and winit; naming it here adds no crate.
bitflags = "2"
egui_dock = { version = "0.16", features = ["serde"] }
rayon = { workspace = true }
tracing.workspace = true
gilrs = "0.11.2"
# BC7 and BC5 compression for imported textures (`asset_db::texture`). `simd`
# adds AVX2 kernels, picked at run time and byte-identical to the scalar ones:
# 3.7x on a 2048² BC7 chain (744 -> 200 ms on one thread). `decode` stays off;
# the engine never decodes BC. Brings two crates besides itself, one of them a
# second major version of `syn` (1.x, through enum-primitive-derive) — compile
# time, not cold start.
rusty_dds = { version = "0.9", default-features = false, features = ["encode", "simd"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# The texture tests decode what they encode, to hold compression to a quality.
rusty_dds = { version = "0.9", default-features = false, features = ["encode", "simd", "decode"] }
# A KTX2 reader and Khronos' descriptor table, so the cache's own KTX2 writer
# is checked against the spec rather than against itself.
ktx2 = "0.5.0"
vk2dfd = "0.1.0"
# Already a dependency above; the input tests need it to build the focus-loss
# window event, which is the one part of `InputState` with no other door in.
winit.workspace = true

[features]
default = ["scripting"]
# C# scripting, on by default: it is what the engine *is*, and a second-class
# build shape is one nobody compiles until it has already rotted.
#
# It is still a feature rather than a plain dependency, for one reason worth the
# `#[cfg]`s: orrin-script pulls netcorehost, which downloads nethost from NuGet
# at build time. `--no-default-features` is the build for a machine with no
# network and no .NET, and CI compiles that shape too so it cannot rot either.
#
# The build watcher rides along: rebuild-on-save has nothing to reload without
# scripting.
scripting = ["dep:orrin-script", "dep:orrin-build"]
# An exported game rather than the editor: trace and debug events are compiled
# out, and warnings and errors are also written to a log file beside the
# executable — see `logging::LogConfig::for_this_build`.
export = ["tracing/max_level_info"]

[[bench]]
name = "bvh"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "collision"
harness = false

[[bench]]
name = "sh"
harness = false

[build-dependencies]
# Compile every shader once to SPIR-V and translate it to MSL (see build.rs).
# shaderc is the compiler vulkano-shaders already builds; spirv-cross2 is the
# translator MoltenVK runs these shaders through today. Neither is linked into
# the engine, so neither can move the cold-start gate.
shaderc = "0.8"
spirv-cross2 = { version = "0.7", default-features = false, features = ["msl"] }

# Native Metal beside Vulkan, on macOS only: the driver in `gfx/metal`. The
# bindings are generated per class and default to all of them, which is the
# compile-time cost of a driver that reaches most of the API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
# The window half of the Metal backend: a CAMetalLayer on the winit view
# (`raw-window-metal` makes or reuses one) and the layer's own API. Both are
# already in the tree through winit's dependencies, so this adds one small crate
# and a feature of another.
raw-window-metal = "1.1"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CAMetalLayer", "objc2-metal", "std"] }

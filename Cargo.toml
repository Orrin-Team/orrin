[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orrin-script = { path = "crates/orrin-script" }
orrin-project = { path = "crates/orrin-project" }
orrin-build = { path = "crates/orrin-build" }
orrin-ecs = { path = "crates/orrin-ecs" }
orrin-registry = { path = "crates/orrin-registry" }
orrin-macros = { path = "crates/orrin-macros" }
vulkano = "0.35"
vulkano-shaders = "0.35"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
# `hdr` is the Radiance decoder the environment bake reads; it is what makes an
# equirectangular HDRI loadable at all, since every LDR format clips the sun.
# `png` and `jpeg` are what an imported glTF's textures actually ship as.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "hdr"] }
# glTF 2.0 import. `default-features = false` drops the crate's own `import`
# feature, which would pull base64, urlencoding and a second, fully-featured
# `image` — the model loader resolves buffer and image URIs itself and decodes
# through the trimmed `image` above, so the codec set stays the one chosen here
# rather than whatever a dependency's defaults enable.
#
# `KHR_texture_transform` is on only so the importer can *detect* it: this
# renderer has no per-material UV transform, and a file using one would sample at
# the wrong texel offsets with nothing to say so.
gltf = { version = "1", default-features = false, features = [
    "utils",
    "names",
    "KHR_texture_transform",
] }
# The engine's only source of parallelism. One pool, built once at startup by
# `orrin_core::threads` — see that module for why it is not rayon's default.
rayon = "1"
# The front end of the engine's one log stream; `orrin_core::logging` is the
# subscriber. Already in the tree through winit, so this adds no crate — and
# without the default `attributes` feature it adds no proc macro either.
tracing = { version = "0.1", default-features = false, features = ["std"] }
egui = "0.31"
egui_winit_vulkano = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
opt-level = 1
# Line tables, not full debuginfo: this is the bulk of dev link time and of
# the target dir, and it buys back nothing the engine reads. Panic backtraces
# and profiler symbolication still resolve; only variable inspection in a
# debugger is lost. Codegen is untouched, so the frame costs do not move.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

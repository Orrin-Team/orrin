[workspace]
resolver = "3"
members = ["crates/*"]
# ferron-script hosts CoreCLR (downloads nethost at build time, targets .NET 10),
# so it's kept out of the default workspace build/CI. Build it explicitly:
#   cargo build --manifest-path crates/ferron-script/Cargo.toml
exclude = ["crates/ferron-script"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ferron-script = { path = "crates/ferron-script" }
ferron-project = { path = "crates/ferron-project" }
ferron-ecs = { path = "crates/ferron-ecs" }
vulkano = "0.35"
vulkano-shaders = "0.35"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
egui = "0.31"
egui_winit_vulkano = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

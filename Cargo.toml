[workspace]
resolver = "3"
members = ["crates/*"]
# orrin-script hosts CoreCLR (downloads nethost at build time, targets .NET 10),
# so it's kept out of the default workspace build/CI. Build it explicitly:
#   cargo build --manifest-path crates/orrin-script/Cargo.toml
exclude = ["crates/orrin-script"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orrin-script = { path = "crates/orrin-script" }
orrin-project = { path = "crates/orrin-project" }
orrin-build = { path = "crates/orrin-build" }
orrin-ecs = { path = "crates/orrin-ecs" }
orrin-registry = { path = "crates/orrin-registry" }
orrin-macros = { path = "crates/orrin-macros" }
vulkano = "0.35"
vulkano-shaders = "0.35"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
egui = "0.31"
egui_winit_vulkano = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
